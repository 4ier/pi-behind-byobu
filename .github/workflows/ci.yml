name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20.x", "22.x", "24.x"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # The integration suite drives a real tmux server, so do not let it skip.
      - name: Ensure tmux is available
        run: |
          if command -v tmux >/dev/null 2>&1; then
            tmux -V
          elif [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi

      # One gate for everything: syntax, tests, and the packed artifact.
      # `npm run check` is also what contributors run locally.
      - name: Check
        run: npm run check
